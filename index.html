
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ربيع القلوب</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e5f3e8, #f8f1df);
  color: #28583e;
  text-align: center;
  padding: 25px 15px;
}
.card {
  max-width: 420px;
  margin: 25px auto;
  padding: 25px 18px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 5px 20px #00000012;
}
h1 { color: #286344; }
p { line-height: 1.8; }
button {
  border: none;
  border-radius: 15px;
  padding: 15px;
  margin: 7px 3px;
  font-size: 18px;
  cursor: pointer;
}
.dhikr {
  background: #e4f1e6;
  color: #245b3c;
  width: 95%;
}
.counter {
  background: #286344;
  color: white;
  width: 85%;
  font-size: 23px;
  padding: 22px;
}
.reset {
  background: #eee8dd;
  color: #51483b;
}
#count { font-size: 38px; margin: 15px; }
footer { margin-top: 25px; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>🌿 ربيع القلوب 🌿</h1>
  <p>ألا بذكر الله تطمئن القلوب</p>

  <h3 id="selected">سبحان الله</h3>
  <div id="count">0 / 100</div>

  <button class="counter" onclick="increment()">
    سبّح الله 🤍
  </button>
  <br>
  <button class="reset" onclick="resetCount()">
    تصفير العدّاد ↺
  </button>

  <hr style="border:0;border-top:1px solid #eee;margin:25px 0">
  <h3>اختاري الذكر</h3>

  <button class="dhikr" onclick="choose('سبحان الله')">
    سبحان الله
  </button>
  <button class="dhikr" onclick="choose('الحمد لله')">
    الحمد لله
  </button>
  <button class="dhikr" onclick="choose('الله أكبر')">
    الله أكبر
  </button>
  <button class="dhikr" onclick="choose('أستغفر الله')">
    أستغفر الله
  </button>
  <button class="dhikr" onclick="choose('لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير')">
    لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير
  </button>

  <footer>اللهم اجعل ألسنتنا عامرة بذكرك 🤍</footer>
</div>

<script>
let count = 
  Number(localStorage.getItem('dhikrCount')) || 0;
let currentDhikr = 'سبحان الله';

function increment() {
  if (count < 100) count++;
  localStorage.setItem('dhikrCount', count);
  document.getElementById('count').textContent =
    count + ' / 100';
  if (count === 100) {
    document.getElementById('selected').textContent =
      currentDhikr + ' — أتممتِ 100 مرة 🌸';
  }
}

function resetCount() {
  count = 0;
  localStorage.setItem('dhikrCount', count);
  document.getElementById('count').textContent = '0 / 100';
  document.getElementById('selected').textContent = currentDhikr;
}

function choose(dhikr) {
  currentDhikr = dhikr;
  count = 0;
  document.getElementById('selected').textContent = dhikr;
  document.getElementById('count').textContent = '0 / 100';
}
</script>
</body>
</html>
